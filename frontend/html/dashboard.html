// Authentication check
function checkAuthentication() {
    const token = localStorage.getItem("jwt_token");
    if (!token) {
        window.location.replace("../login/login.html");
        return;
    }
    
    const user = Utils.parseJwt(token).user;
    if (!user || user.role !== Constants.ADMIN_ROLE) {
        alert("Access denied. Admin role required.");
        window.location.replace("../index.html");
        return;
    }
    
    // Display user info
    $('#dashboard-username').text(`(${user.name})`);
    $('#dashboard-role').text(`Role: ${user.role}`);
}

// Load functions (your existing code)
function loadUsers() {
    userService.getAll()
        .then(function(data) {
            let html = '';
            (data.data || []).forEach(function(u) {
                html += `<tr>
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.role}</td>
                    <td>
                        <button class="btn btn-sm btn-primary edit-user" data-id="${u.id}">Edit</button>
                        <button class="btn btn-sm btn-danger delete-user" data-id="${u.id}">Delete</button>
                    </td>
                </tr>`;
            });
            $('#users-table tbody').html(html);
        })
        .catch(function(error) {
            console.error('Error loading users:', error);
            alert('Error loading users. Please try again.');
        });
}

// Modal functions
// Fix the showUserModal function
function showUserModal(userData = null) {
    const modalHtml = `
        <div class="modal fade" id="userModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">${userData ? 'Edit' : 'Add'} User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="user-form">
                            <input type="hidden" id="user-id" value="${userData ? userData.id : ''}">
                            <div class="mb-3">
                                <label for="user-name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="user-name" value="${userData ? userData.name : ''}" required>
                            </div>
                            <div class="mb-3">
                                <label for="user-email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="user-email" value="${userData ? userData.email : ''}" required>
                            </div>
                            <div class="mb-3">
                                <label for="user-role" class="form-label">Role</label>
                                <select class="form-control" id="user-role" required>
                                    <option value="">Select Role</option>
                                    <option value="${Constants.ADMIN_ROLE}" ${userData && userData.role === Constants.ADMIN_ROLE ? 'selected' : ''}>Admin</option>
                                    <option value="${Constants.INSTRUCTOR_ROLE}" ${userData && userData.role === Constants.INSTRUCTOR_ROLE ? 'selected' : ''}>Instructor</option>
                                    <option value="${Constants.STUDENT_ROLE}" ${userData && userData.role === Constants.STUDENT_ROLE ? 'selected' : ''}>Student</option>
                                </select>
                            </div>
                            ${!userData ? '<div class="mb-3"><label for="user-password" class="form-label">Password</label><input type="password" class="form-control" id="user-password" required></div>' : ''}
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="saveUser()">Save</button>
                    </div>
                </div>
            </div>
        </div>`;
    
    $('#admin-modal-placeholder').html(modalHtml);
    $('#userModal').modal('show');
}
// CRUD operations
function saveUser() {
    const id = $('#user-id').val();
    const userData = {
        name: $('#user-name').val(),
        email: $('#user-email').val(),
        role: $('#user-role').val()
    };
    
    if (!id) {
        userData.password = $('#user-password').val();
    }
    
    const promise = id ? userService.update(id, userData) : userService.create(userData);
    
    promise.then(function() {
        $('#userModal').modal('hide');
        loadUsers();
        alert(id ? 'User updated successfully!' : 'User created successfully!');
    }).catch(function(error) {
        console.error('Error saving user:', error);
        alert('Error saving user. Please try again.');
    });
}

function editUser(id) {
    userService.getById(id)
        .then(function(userData) {
            showUserModal(userData);
        })
        .catch(function(error) {
            console.error('Error loading user:', error);
            alert('Error loading user data.');
        });
}

function deleteUser(id) {
    if (confirm('Are you sure you want to delete this user?')) {
        userService.delete(id)
            .then(function() {
                loadUsers();
                alert('User deleted successfully!');
            })
            .catch(function(error) {
                console.error('Error deleting user:', error);
                alert('Error deleting user. Please try again.');
            });
    }
}
