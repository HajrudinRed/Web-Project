<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Educos - Online Learning Platform</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="assets/img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="assets/lib/animate/animate.min.css" rel="stylesheet">
    <link href="assets/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">    <!-- Template Stylesheet -->
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/spapp.css" rel="stylesheet">
    
    <!-- Toastr for notifications -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <!-- Add DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <!-- JavaScript Libraries - Load jQuery first -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- DataTables JS - Load after jQuery -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    
    <!-- Other Libraries -->
    <script src="assets/lib/wow/wow.min.js"></script>
    <script src="assets/lib/easing/easing.min.js"></script>
    <script src="assets/lib/waypoints/waypoints.min.js"></script>
    <script src="assets/lib/owlcarousel/owl.carousel.min.js"></script>
    
    <!-- Toastr -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    
    <!-- Spapp Framework -->
    <script src="assets/js/jquery.spapp.js"></script>

    <!-- Utility scripts -->
    <script src="utils/constants.js"></script>
    <script src="utils/rest-client.js"></script>
    <script src="utils/utils.js"></script>
    <script src="utils/course-service.js"></script>
    <script src="utils/category-service.js"></script>
    <script src="utils/user-service.js"></script>
    <script src="utils/instructor-service.js"></script>
    <script src="utils/review-service.js"></script>

    <!-- Template Javascript -->
    <script src="assets/js/main.js"></script>

</head>

<body>
    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0" role="navigation">
        <a href="#home" class="navbar-brand d-flex align-items-center px-4 px-lg-5">
            <h2 class="m-0 text-primary"><i class="fa fa-book me-3"></i>Educos</h2>
        </a>
        <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto p-4 p-lg-0">
                <span id="navbar-user-links"></span>
                <a href="#dashboard" class="nav-item nav-link" id="dashboard-link">Dashboard</a>
                <a href="#home" class="nav-item nav-link">Home</a>
                <a href="#about" class="nav-item nav-link">About</a>
                <a href="#courses" class="nav-item nav-link">Courses</a>
                <div class="nav-item dropdown">
                    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Pages</a>
                    <div class="dropdown-menu fade-down m-0">
                        <a href="#team" class="dropdown-item">Our Team</a>
                        <a href="#testimonial" class="dropdown-item">Testimonial</a>
                        <a href="#404" class="dropdown-item">404 Page</a>
                    </div>
                </div>
                <a href="#contact" class="nav-item nav-link">Contact</a>
            </div>            <span id="join-now-section">
                <a href="javascript:void(0)" class="btn btn-primary py-4 px-lg-5 d-none d-lg-block" onclick="navigateToRegister()">Join Now<i class="fa fa-arrow-right ms-3"></i></a>
            </span>
        </div>
    </nav>
    <!-- Navbar End -->    <!-- Spapp Start -->
    <main id="spapp" role="main">
        <section id="home" data-load="home.html"></section>
        <section id="contact" data-load="contact.html"></section>
        <section id="404" data-load="404.html"></section>
        <section id="courses" data-load="courses.html"></section>
        <section id="team" data-load="team.html"></section>
        <section id="testimonial" data-load="testimonial.html"></section>
        <section id="about" data-load="about.html"></section>
        <section id="dashboard" data-load="dashboard.html"></section>
    </main>
    <!-- Spapp End -->

    <script>        // Initialize Spapp with proper configuration
        console.log('Initializing Spapp with templateDir: ./html/');
        let app = $.spapp({
            defaultView: "home",
            templateDir: "./html/",
            pageNotFound: "404"
        });
        
        // Verify configuration was applied
        console.log('Spapp app object:', app);

        // Configure routes with custom callbacks
        app.route({
            view: "home",
            onCreate: function() {
                console.log('Home page created');
                updateActiveNav('home');
                checkAuthStatus();
            },
            onReady: function() {
                console.log('Home page ready');
                initializeCarousels();
                if (typeof WOW !== 'undefined') {
                    new WOW().init();
                }
            }
        });        app.route({
            view: "dashboard",
            onCreate: function() {
                console.log('Dashboard page created');
                updateActiveNav('dashboard');
                // Check if user is authenticated and has admin role
                if (!requireAdminAuth()) {
                    return;
                }
            },
            onReady: function() {
                console.log('Dashboard page ready');
                // Initialize DataTables if they exist
                if (typeof $.fn.DataTable !== 'undefined') {
                    $('.data-table').DataTable({
                        responsive: true,
                        pageLength: 10,
                        order: [[0, 'desc']]
                    });
                }
            }
        });

        // Configure other routes
        ['about', 'courses', 'contact', 'team', 'testimonial', '404'].forEach(function(view) {
            app.route({
                view: view,
                onCreate: function() {
                    console.log(view + ' page created');
                    updateActiveNav(view);
                    checkAuthStatus();
                },
                onReady: function() {
                    console.log(view + ' page ready');
                    initializeCarousels();
                    if (typeof WOW !== 'undefined') {
                        new WOW().init();
                    }
                }
            });
        });

        // Initialize carousels
        function initializeCarousels() {
            // Destroy existing carousels first
            if (typeof $.fn.owlCarousel !== 'undefined') {
                $('.owl-carousel').trigger('destroy.owl.carousel');
                $('.owl-carousel').removeClass('owl-loaded');
                $('.owl-carousel').find('.owl-stage-outer').children().unwrap();
            }
            
            setTimeout(function() {
                // Header carousel
                if ($('.header-carousel').length > 0) {
                    $('.header-carousel').owlCarousel({
                        autoplay: true,
                        smartSpeed: 1500,
                        items: 1,
                        dots: false,
                        loop: true,
                        nav: true,
                        navText: [
                            '<i class="bi bi-chevron-left"></i>',
                            '<i class="bi bi-chevron-right"></i>'
                        ]
                    });
                }
                
                // Testimonial carousel
                if ($('.testimonial-carousel').length > 0) {
                    $('.testimonial-carousel').owlCarousel({
                        autoplay: true,
                        smartSpeed: 1000,
                        center: true,
                        margin: 24,
                        dots: true,
                        loop: true,
                        nav: false,
                        responsive: {
                            0: { items: 1 },
                            768: { items: 2 },
                            992: { items: 3 }
                        }
                    });
                }
            }, 200);
        }        // Update active navigation
        function updateActiveNav(viewName) {
            // Remove all active classes
            $('.nav-item .nav-link, .dropdown-item').removeClass('active');
            
            // Add active class to current view (viewName already contains the clean name)
            $(`a[href="#${viewName}"]`).addClass('active');
        }

        // Authentication functions
        function checkAuthStatus() {
            var token = localStorage.getItem("user_token") || localStorage.getItem("jwt_token");
            var userData = localStorage.getItem("user_data");
            
            if (token && token !== "undefined" && userData && userData !== "undefined") {
                try {
                    var user = JSON.parse(userData);
                    showLoggedInUser(user);
                } catch (e) {
                    console.error('Error parsing user data:', e);
                    showGuestUser();
                }
            } else {
                showGuestUser();
            }
        }        function showLoggedInUser(user) {
            console.log('User logged in:', user);
            
            // Show dashboard link only for admin users
            if (user.role === Constants.ADMIN_ROLE) {
                $('#dashboard-link').show();
            } else {
                $('#dashboard-link').hide();
            }
            
            // Update navbar user links
            $('#navbar-user-links').html(`
                <a href="javascript:void(0)" onclick="logout()" id="logout-link" class="nav-item nav-link">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            `);
            
            // Replace Join Now with user dropdown - include dashboard only for admins
            let dropdownItems = '';
            if (user.role === Constants.ADMIN_ROLE) {
                dropdownItems += `
                    <a href="#dashboard" class="dropdown-item">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <div class="dropdown-divider"></div>`;
            }
            dropdownItems += `
                <a href="javascript:void(0)" onclick="logout()" class="dropdown-item">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>`;
            
            $('#join-now-section').html(`
                <div class="nav-item dropdown d-none d-lg-block">
                    <a href="#" class="btn btn-primary py-4 px-lg-5 dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="fas fa-user"></i> ${user.name || user.email || 'User'}
                        <small class="d-block text-light">${user.role || 'Student'}</small>
                    </a>
                    <div class="dropdown-menu">
                        ${dropdownItems}
                    </div>
                </div>
            `);
        }

        function showGuestUser() {
            console.log('Guest user');
            
            // Hide dashboard link
            $('#dashboard-link').hide();            // Show login link
            $('#navbar-user-links').html(`
                <a href="javascript:void(0)" id="login-link" class="nav-item nav-link" onclick="navigateToLogin()">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
            `);
            
            // Show Join Now button
            $('#join-now-section').html(`
                <a href="javascript:void(0)" class="btn btn-primary py-4 px-lg-5 d-none d-lg-block" onclick="navigateToRegister()">
                    Join Now<i class="fa fa-arrow-right ms-3"></i>
                </a>
            `);        }

        // Navigation functions for authentication
        function navigateToLogin() {
            console.log('Navigating to login page');
            window.location.href = '/web-project/login/login.html';
        }

        function navigateToRegister() {
            console.log('Navigating to register page');
            window.location.href = '/web-project/register/register.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                // Clear all authentication data
                localStorage.removeItem("user_token");
                localStorage.removeItem("jwt_token");
                localStorage.removeItem("user_data");
                
                // Show success message
                if (typeof toastr !== 'undefined') {
                    toastr.success('Logged out successfully!');
                }
                
                // Update UI
                showGuestUser();
                  // Redirect to home
                window.location.hash = '#home';
            }
        }        // Global helper functions
        window.requireAuth = function() {
            var token = localStorage.getItem("user_token") || localStorage.getItem("jwt_token");
            if (!token || token === "undefined") {
                if (typeof toastr !== 'undefined') {
                    toastr.warning('Please login to access this page.');
                }
                window.location.href = '/web-project/login/login.html';
                return false;
            }
            return true;
        };

        window.requireAdminAuth = function() {
            var token = localStorage.getItem("user_token") || localStorage.getItem("jwt_token");
            if (!token || token === "undefined") {
                if (typeof toastr !== 'undefined') {
                    toastr.warning('Please login to access this page.');
                }
                window.location.href = '/web-project/login/login.html';
                return false;
            }
            
            var userData = localStorage.getItem("user_data");
            if (userData && userData !== "undefined") {
                try {
                    var user = JSON.parse(userData);
                    if (user.role !== Constants.ADMIN_ROLE) {
                        if (typeof toastr !== 'undefined') {
                            toastr.error('Access denied. Admin privileges required.');
                        }
                        window.location.hash = '#home';
                        return false;
                    }
                } catch (e) {
                    console.error('Error parsing user data:', e);
                    if (typeof toastr !== 'undefined') {
                        toastr.error('Authentication error. Please login again.');
                    }
                    window.location.href = '/web-project/login/login.html';
                    return false;
                }
            } else {
                if (typeof toastr !== 'undefined') {
                    toastr.error('User data not found. Please login again.');
                }
                window.location.href = '/web-project/login/login.html';
                return false;
            }
            return true;
        };

        window.getCurrentUser = function() {
            var userData = localStorage.getItem("user_data");
            if (userData && userData !== "undefined") {
                try {
                    return JSON.parse(userData);
                } catch (e) {
                    console.error('Error parsing user data:', e);
                    return null;
                }
            }
            return null;
        };        // Document ready
        $(document).ready(function() {
            console.log('Document ready - initializing application');
            console.log('jQuery version:', $.fn.jquery);
            console.log('Spapp function available:', typeof $.spapp);
            
            // Check if sections exist
            console.log('Available sections:', $('#spapp section').length);
            $('#spapp section').each(function() {
                console.log('Section:', $(this).attr('id'), 'data-load:', $(this).data('load'));
            });
            
            // Add event listeners for authentication navigation
            $(document).on('click', '#login-link', function(e) {
                e.preventDefault();
                navigateToLogin();
            });
            
            $(document).on('click', '[onclick*="navigateToRegister"]', function(e) {
                e.preventDefault();
                navigateToRegister();
            });
            
            // Debug Spapp configuration
            console.log('Spapp configuration:', {
                defaultView: "home",
                templateDir: "./html/",
                currentHash: window.location.hash
            });
            
            // Run Spapp
            try {
                app.run();
                console.log('Spapp initialized successfully');
                
                // Force load home page if no hash
                if (!window.location.hash) {
                    console.log('No hash found, setting to #home');
                    window.location.hash = '#home';
                }
            } catch (error) {
                console.error('Error initializing Spapp:', error);
                // Fallback: manually load home page
                $('#spapp section#home').load('./html/home.html', function(response, status, xhr) {
                    if (status === "error") {
                        console.error('Error loading home.html:', xhr.status, xhr.statusText);
                        $('#spapp').html(`
                            <div class="container py-5 text-center">
                                <h2 class="text-danger">Error Loading Content</h2>
                                <p>Failed to load page content. Status: ${xhr.status}</p>
                                <p class="text-muted">Error: ${xhr.statusText}</p>
                                <button onclick="location.reload()" class="btn btn-primary">Reload Page</button>
                            </div>
                        `);
                    } else {
                        console.log('Home page loaded successfully');
                        checkAuthStatus();
                        initializeCarousels();
                    }
                });
            }
        });
    </script>

</body>
</html>
