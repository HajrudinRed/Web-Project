<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Educos - Login</title>

    <!-- Custom fonts for this template-->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">    <!-- Custom styles for this template-->
    <link href="/web-project/frontend/assets/css/sb-admin-2.min.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">    <!-- Toastr for notifications -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    
    <!-- Custom styles for smaller validation messages -->
    <style>
        .error {
            font-size: 0.75rem !important;
            color: #dc3545 !important;
            margin-top: 2px !important;
            display: block !important;
        }
        
        .invalid-feedback {
            font-size: 0.75rem !important;
        }
        
        /* Make form labels smaller */
        .form-label.small {
            font-size: 0.8rem !important;
        }
        
        /* Make form check labels smaller */
        .form-check-label {
            font-size: 0.85rem !important;
        }
    </style>
</head>

<body style="background-color: #06BBCC;">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="row justify-content-center w-100">
            <div class="col-xl-10 col-lg-12 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="row">                            <div class="col-lg-6 d-none d-lg-block">
                                <img src="/web-project/frontend/assets/img/about.jpg" alt="Login Image" class="img-fluid w-100 h-100" style="object-fit: cover;">
                            </div>
                            <div class="col-lg-6">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">Welcome Back!</h1>
                                    </div>
                                    <form class="user" id="login-form">
                                        <div class="form-group mb-3">
                                            <input type="email" class="form-control form-control-user"
                                                id="email" name="email" placeholder="Enter Email Address..." required>
                                            <div class="invalid-feedback"></div>
                                        </div>
                                        <div class="form-group mb-3">
                                            <input type="password" class="form-control form-control-user"
                                                id="password" name="password" placeholder="Password" required>
                                            <div class="invalid-feedback"></div>
                                        </div>                                        <div class="form-group mb-3">
                                            <div class="form-check">
                                                <input type="checkbox" class="form-check-input" id="customCheck">
                                                <label class="form-check-label" for="customCheck">Remember Me</label>
                                            </div>
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-user btn-block">
                                            Login
                                        </button>
                                    </form>
                                    <hr>                                    
                                    <div class="text-center">
                                        <a class="small" href="/web-project/register/register.html">Create an Account!</a>
                                    </div>
                                    <div class="text-center">
                                        <a class="small" href="/web-project/frontend/index.html">Back to Website</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.3/dist/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script>
        // Constants
        const Constants = {
            PROJECT_BASE_URL: "http://localhost/web-project/backend/"
        };        $(document).ready(function() {            // Check if user is already logged in (TEMPORARILY DISABLED FOR TESTING)
            // var token = localStorage.getItem("user_token") || localStorage.getItem("jwt_token");
            // if (token && token !== "undefined") {
            //     window.location.replace("/web-project/frontend/index.html");
            //     return;
            // }// Form validation
            $("#login-form").validate({
                errorClass: "error",
                errorElement: "small",
                errorPlacement: function(error, element) {
                    error.insertAfter(element);
                },
                rules: {
                    email: {
                        required: true,
                        email: true
                    },
                    password: {
                        required: true,
                        minlength: 6
                    }
                },                messages: {
                    email: {
                        required: "Required",
                        email: "Invalid"
                    },
                    password: {
                        required: "Required",
                        minlength: "Too short"
                    }
                },
                submitHandler: function(form) {
                    var credentials = {
                        email: $("#email").val(),
                        password: $("#password").val()
                    };
                    loginUser(credentials);
                }
            });
        });

        function loginUser(credentials) {
            $.ajax({
                url: Constants.PROJECT_BASE_URL + "auth/login",
                type: "POST",
                data: JSON.stringify(credentials),
                contentType: "application/json",
                dataType: "json",
                beforeSend: function() {
                    $("button[type='submit']").prop('disabled', true).text('Logging in...');
                },
                success: function(result) {
                    console.log('Login successful:', result);
                    
                    // Store authentication data
                    localStorage.setItem("user_token", result.data.token);
                    localStorage.setItem("jwt_token", result.data.token);
                    localStorage.setItem("user_data", JSON.stringify(result.data));
                    
                    toastr.success('Login successful!');
                      setTimeout(function() {
                        window.location.replace("/web-project/frontend/index.html");
                    }, 1000);
                },
                error: function(xhr, status, error) {
                    console.error('Login error:', xhr.responseJSON);
                    var errorMessage = 'Login failed';
                    
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMessage = xhr.responseJSON.error;
                    }
                    
                    toastr.error(errorMessage);
                },
                complete: function() {
                    $("button[type='submit']").prop('disabled', false).text('Login');
                }
            });
        }
    </script>
</body>
</html>
