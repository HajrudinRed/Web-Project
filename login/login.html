<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login - Educos</title>

    <!-- Custom fonts for this template-->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <!-- Custom styles for this template-->
    <link href="../frontend/assets/css/sb-admin-2.min.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- jQuery Validation -->
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.3/dist/jquery.validate.min.js"></script>
    <!-- Toastr for notifications -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
</head>

<body style="background-color: #06BBCC;">

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        
        <!-- Outer Row -->
        <div class="row justify-content-center">
            <div class="col-xl-10 col-lg-12 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <!-- Nested Row within Card Body -->
                        <div class="row">
                            <div class="col-lg-6 d-none d-lg-block">
                                <img src="../frontend/assets/img/about.jpg" alt="Login Image" class="img-fluid w-100 h-100" style="object-fit: cover;">
                            </div>
                            <div class="col-lg-6">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">Welcome Back!</h1>
                                    </div>
                                    <form class="user" id="login-form">
                                        <div class="form-group">
                                            <input type="email" class="form-control form-control-user"
                                                id="email" name="email" placeholder="Enter Email Address..." required>
                                        </div>
                                        <div class="form-group">
                                            <input type="password" class="form-control form-control-user"
                                                id="password" name="password" placeholder="Password" required>
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-user btn-block">
                                            Login
                                        </button>
                                    </form>
                                    <hr>
                                    <div class="text-center">
                                        <a class="small" href="../register/register.html">Create an Account!</a>
                                    </div>
                                    <div class="text-center">
                                        <a class="small" href="../frontend/#home">Back to Website</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="../frontend/utils/constants.js"></script>
    <script>
        $(document).ready(function() {
            // Check if user is already logged in
            var token = localStorage.getItem("user_token");
            if (token && token !== "undefined") {
                // ✅ Fixed redirect URL
                window.location.replace("../frontend/#home");
            }

            // Form validation and submission
            $("#login-form").validate({
                rules: {
                    email: {
                        required: true,
                        email: true
                    },
                    password: {
                        required: true,
                        minlength: 6
                    }
                },
                messages: {
                    email: {
                        required: "Please enter your email",
                        email: "Please enter a valid email address"
                    },
                    password: {
                        required: "Please enter your password",
                        minlength: "Password must be at least 6 characters"
                    }
                },
                submitHandler: function(form) {
                    var entity = {
                        email: $("#email").val(),
                        password: $("#password").val()
                    };
                    loginUser(entity);
                }
            });
        });

        function loginUser(credentials) {
            $.ajax({
                url: Constants.PROJECT_BASE_URL + "auth/login",
                type: "POST",
                data: JSON.stringify(credentials),
                contentType: "application/json",
                dataType: "json",
                beforeSend: function() {
                    $("button[type='submit']").prop('disabled', true).text('Logging in...');
                },
                success: function(result) {
                    console.log('Login successful:', result);
                    localStorage.setItem("user_token", result.data.token);
                    localStorage.setItem("user_data", JSON.stringify(result.data)); // ✅ Store user data too
                    toastr.success('Login successful! Redirecting...');
                    
                    // ✅ Fixed redirect URL - redirect to frontend with hash route
                    setTimeout(function() {
                        window.location.replace("../frontend/#home");
                    }, 1000);
                },
                error: function(xhr, status, error) {
                    console.error('Login error:', xhr.responseJSON);
                    var errorMessage = 'Login failed. Please check your credentials.';
                    
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMessage = xhr.responseJSON.error;
                    }
                    
                    toastr.error(errorMessage);
                },
                complete: function() {
                    $("button[type='submit']").prop('disabled', false).text('Login');
                }
            });
        }
    </script>

</body>

</html>
