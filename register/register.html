<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Educos - Register</title>

    <!-- Custom fonts for this template-->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">    <!-- Custom styles for this template-->
    <link href="/web-project/frontend/assets/css/sb-admin-2.min.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">    <!-- Toastr for notifications -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    
    <!-- Custom styles for smaller validation messages -->
    <style>
        .error {
            font-size: 0.75rem !important;
            color: #dc3545 !important;
            margin-top: 2px !important;
            display: block !important;
        }
        
        .invalid-feedback {
            font-size: 0.75rem !important;
        }
        
        /* Make form labels smaller */
        .form-label.small {
            font-size: 0.8rem !important;
        }
        
        /* Make role description text smaller */
        .form-check-label small {
            font-size: 0.7rem !important;
        }
        
        /* Reduce spacing for instructor fields helper text */
        .text-muted {
            font-size: 0.75rem !important;
        }
    </style>
</head>

<body style="background-color: #06BBCC;">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="row justify-content-center w-100">
            <div class="col-xl-10 col-lg-12 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="row">                            <div class="col-lg-5 d-none d-lg-block">
                                <img src="/web-project/frontend/assets/img/about.jpg" alt="Registration Image" class="img-fluid w-100 h-100" style="object-fit: cover;">
                            </div>
                            <div class="col-lg-7">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">Create an Account!</h1>
                                    </div>
                                    <form class="user" id="register-form">
                                        <div class="form-group row mb-3">
                                            <div class="col-sm-6 mb-3 mb-sm-0">
                                                <input type="text" class="form-control form-control-user" 
                                                    id="firstName" name="firstName" placeholder="First Name" required>
                                                <div class="invalid-feedback"></div>
                                            </div>
                                            <div class="col-sm-6">
                                                <input type="text" class="form-control form-control-user" 
                                                    id="lastName" name="lastName" placeholder="Last Name" required>
                                                <div class="invalid-feedback"></div>
                                            </div>
                                        </div>
                                        <div class="form-group mb-3">
                                            <input type="email" class="form-control form-control-user" 
                                                id="email" name="email" placeholder="Email Address" required>
                                            <div class="invalid-feedback"></div>
                                        </div>
                                          <!-- ✅ Role Selection -->
                                        <div class="form-group mb-3">
                                            <label class="form-label text-gray-600 small mb-2">Select Your Role:</label>
                                            <div class="row">
                                                <div class="col-sm-6">
                                                    <div class="form-check">
                                                        <input type="radio" class="form-check-input" id="roleStudent" 
                                                            name="role" value="student" checked>
                                                        <label class="form-check-label" for="roleStudent">
                                                            <i class="fas fa-graduation-cap text-primary me-2"></i>Student
                                                            <small class="d-block text-muted">Learn new skills and courses</small>
                                                        </label>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6">
                                                    <div class="form-check">
                                                        <input type="radio" class="form-check-input" id="roleInstructor" 
                                                            name="role" value="instructor">
                                                        <label class="form-check-label" for="roleInstructor">
                                                            <i class="fas fa-chalkboard-teacher text-success me-2"></i>Instructor
                                                            <small class="d-block text-muted">Teach and create courses</small>
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- ✅ Additional Instructor Fields (Hidden by default) -->
                                        <div id="instructor-fields" style="display: none;">
                                            <div class="form-group mb-3">
                                                <textarea class="form-control" id="bio" name="bio" rows="3" 
                                                    placeholder="Tell us about your expertise and experience..."></textarea>
                                                <small class="text-muted">Brief description of your background and expertise</small>
                                            </div>
                                            <div class="form-group mb-3">
                                                <input type="text" class="form-control form-control-user" 
                                                    id="expertise" name="expertise" placeholder="Areas of Expertise (e.g., Web Development, Data Science)">
                                            </div>
                                        </div>

                                        <div class="form-group row mb-3">
                                            <div class="col-sm-6 mb-3 mb-sm-0">
                                                <input type="password" class="form-control form-control-user"
                                                    id="password" name="password" placeholder="Password" required>
                                                <div class="invalid-feedback"></div>
                                            </div>
                                            <div class="col-sm-6">
                                                <input type="password" class="form-control form-control-user"
                                                    id="confirmPassword" name="confirmPassword" placeholder="Repeat Password" required>
                                                <div class="invalid-feedback"></div>
                                            </div>
                                        </div>                                        <!-- ✅ Terms and Conditions -->
                                        <div class="form-group mb-3">
                                            <div class="form-check">
                                                <input type="checkbox" class="form-check-input" id="agreeTerms" name="agreeTerms" required>
                                                <label class="form-check-label" for="agreeTerms">
                                                    I agree to the <a href="#" class="text-primary">Terms and Conditions</a>
                                                </label>
                                            </div>
                                        </div>

                                        <button type="submit" class="btn btn-primary btn-user btn-block">
                                            Register Account
                                        </button>
                                    </form>
                                    <hr>
                                    <div class="text-center">                                        <a class="small" href="/web-project/login/login.html">Already have an account? Login!</a>
                                    </div>
                                    <div class="text-center">
                                        <a class="small" href="/web-project/frontend/index.html">Back to Website</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.3/dist/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script>
        // Constants
        const Constants = {
            PROJECT_BASE_URL: "http://localhost/web-project/backend/"
        };        $(document).ready(function() {
            // Check if user is already logged in (TEMPORARILY DISABLED FOR TESTING)
            // var token = localStorage.getItem("user_token") || localStorage.getItem("jwt_token");
            // if (token && token !== "undefined") {
            //     window.location.replace("/web-project/frontend/index.html");
            //     return;
            // }

            // Show/hide instructor fields based on role selection
            $('input[name="role"]').change(function() {
                if ($(this).val() === 'instructor') {
                    $('#instructor-fields').slideDown();
                    $('#bio').attr('required', true);
                    $('#expertise').attr('required', true);
                } else {
                    $('#instructor-fields').slideUp();
                    $('#bio').removeAttr('required');
                    $('#expertise').removeAttr('required');
                }
            });            // Form validation
            $("#register-form").validate({
                errorClass: "error",
                errorElement: "small",
                errorPlacement: function(error, element) {
                    error.insertAfter(element);
                },
                rules: {
                    firstName: {
                        required: true,
                        minlength: 2
                    },
                    lastName: {
                        required: true,
                        minlength: 2
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    password: {
                        required: true,
                        minlength: 6
                    },
                    confirmPassword: {
                        required: true,
                        equalTo: "#password"
                    },
                    agreeTerms: {
                        required: true
                    }
                },                messages: {
                    firstName: {
                        required: "Required",
                        minlength: "Too short"
                    },
                    lastName: {
                        required: "Required",
                        minlength: "Too short"
                    },
                    email: {
                        required: "Required",
                        email: "Invalid"
                    },
                    password: {
                        required: "Required",
                        minlength: "Too short"
                    },
                    confirmPassword: {
                        required: "Required",
                        equalTo: "Don't match"
                    },
                    agreeTerms: {
                        required: "Required"
                    }
                },
                submitHandler: function(form) {
                    var userData = {
                        name: $("#firstName").val() + " " + $("#lastName").val(),
                        email: $("#email").val(),
                        password: $("#password").val(),
                        role: $('input[name="role"]:checked').val()
                    };

                    // Add instructor-specific fields if instructor role selected
                    if (userData.role === 'instructor') {
                        userData.bio = $("#bio").val();
                        userData.expertise = $("#expertise").val();
                    }

                    registerUser(userData);
                }
            });
        });

        function registerUser(userData) {
            $.ajax({
                url: Constants.PROJECT_BASE_URL + "auth/register",
                type: "POST",
                data: JSON.stringify(userData),
                contentType: "application/json",
                dataType: "json",
                beforeSend: function() {
                    $("button[type='submit']").prop('disabled', true).text('Creating Account...');
                },
                success: function(result) {
                    console.log('Registration successful:', result);
                    
                    toastr.success('Account created! Redirecting to login...');
                    
                    setTimeout(function() {
                        window.location.replace("/web-project/login/login.html");
                    }, 2000);
                },
                error: function(xhr, status, error) {
                    console.error('Registration error:', xhr.responseJSON);
                    var errorMessage = 'Registration failed';
                    
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMessage = xhr.responseJSON.error;
                    }
                    
                    toastr.error(errorMessage);
                },
                complete: function() {
                    $("button[type='submit']").prop('disabled', false).text('Register Account');
                }
            });
        }
    </script>
</body>
</html>
