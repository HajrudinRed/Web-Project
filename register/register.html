<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Register - Educos</title>

    <!-- Custom fonts for this template-->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <!-- Custom styles for this template-->
    <link href="../frontend/assets/css/sb-admin-2.min.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- jQuery Validation -->
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.3/dist/jquery.validate.min.js"></script>
    <!-- Toastr for notifications -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
</head>

<body style="background-color: #06BBCC;">

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <!-- Nested Row within Card Body -->
                <div class="row">
                    <div class="col-lg-5 d-none d-lg-block">
                        <img src="../frontend/assets/img/about.jpg" alt="Registration Image" class="img-fluid w-100 h-100" style="object-fit: cover;">
                    </div>
                    <div class="col-lg-7">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4">Create an Account!</h1>
                            </div>
                            <!-- Registration form -->
                            <form class="user" id="register-form">
                                <div class="form-group">
                                    <input type="text" class="form-control form-control-user" 
                                        id="name" name="name" placeholder="Full Name" required>
                                </div>
                                <div class="form-group">
                                    <input type="email" class="form-control form-control-user" 
                                        id="email" name="email" placeholder="Email Address" required>
                                </div>
                                <div class="form-group">
                                    <select class="form-control form-control-user" id="role" name="role" required>
                                        <option value="">Select Role</option>
                                        <option value="student">Student</option>
                                        <option value="instructor">Instructor</option>
                                    </select>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="password" class="form-control form-control-user"
                                            id="password" name="password" placeholder="Password" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="password" class="form-control form-control-user"
                                            id="confirm_password" name="confirm_password" placeholder="Repeat Password" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block">
                                    Register Account
                                </button>
                            </form>
                            <hr>
                            <div class="text-center">
                                <a class="small" href="../login/login.html">Already have an account? Login!</a>
                            </div>
                            <div class="text-center">
                                <a class="small" href="../frontend/#home">Back to Website</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../frontend/utils/constants.js"></script>
    <script>
        // Registration functionality
        $(document).ready(function() {
            // Check if user is already logged in
            var token = localStorage.getItem("user_token");
            if (token && token !== "undefined") {
                // ✅ Fixed redirect URL
                window.location.replace("../frontend/#home");
            }

            // Form validation
            $("#register-form").validate({
                rules: {
                    name: {
                        required: true,
                        minlength: 2
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    role: {
                        required: true
                    },
                    password: {
                        required: true,
                        minlength: 6
                    },
                    confirm_password: {
                        required: true,
                        equalTo: "#password"
                    }
                },
                messages: {
                    name: {
                        required: "Please enter your name",
                        minlength: "Name must be at least 2 characters"
                    },
                    email: {
                        required: "Please enter your email",
                        email: "Please enter a valid email address"
                    },
                    role: {
                        required: "Please select a role"
                    },
                    password: {
                        required: "Please enter a password",
                        minlength: "Password must be at least 6 characters"
                    },
                    confirm_password: {
                        required: "Please confirm your password",
                        equalTo: "Passwords do not match"
                    }
                },
                submitHandler: function(form) {
                    var formData = {
                        name: $("#name").val(),
                        email: $("#email").val(),
                        password: $("#password").val(),
                        role: $("#role").val()
                    };
                    
                    registerUser(formData);
                }
            });
        });

        function registerUser(userData) {
            $.ajax({
                url: Constants.PROJECT_BASE_URL + "auth/register",
                type: "POST",
                data: JSON.stringify(userData),
                contentType: "application/json",
                dataType: "json",
                beforeSend: function() {
                    $("button[type='submit']").prop('disabled', true).text('Registering...');
                },
                success: function(result) {
                    console.log(result);
                    toastr.success('Registration successful! Please login.');
                    setTimeout(function() {
                        window.location.href = "../login/login.html";
                    }, 2000);
                },
                error: function(xhr, status, error) {
                    console.error('Registration error:', xhr.responseJSON);
                    var errorMessage = 'Registration failed. Please try again.';
                    
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMessage = xhr.responseJSON.error;
                    }
                    
                    toastr.error(errorMessage);
                },
                complete: function() {
                    $("button[type='submit']").prop('disabled', false).text('Register Account');
                }
            });
        }
    </script>

</body>

</html>
